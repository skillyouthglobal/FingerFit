name: Build FingerFit APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -o ./FingerFit-project3.zip -d work
          BUILD_FILE=$(find work -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            TARGET_DIR=$(dirname "$BUILD_FILE")
            echo "PROJECT_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=work" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug
          fi

      - name: Find and Copy APK
        run: |
          APK_PATH=$(find work -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" FingerFit.apk
          else
            echo "APK output file not found" && exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerFit-apk
          path: FingerFit.apk
