name: Build FingerFit APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -o ./FingerFit-project3.zip -d work
          d=$(dirname "$(find work -name gradlew | head -1)")
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"

      - name: Build APK with Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find and Copy APK
        run: |
          APK_PATH=$(find work -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" FingerFit.apk
          else
            echo "APK file not found" && exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerFit-apk
          path: FingerFit.apk
