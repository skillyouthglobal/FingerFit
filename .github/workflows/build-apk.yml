name: Build FingerFit APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -o ./FingerFit-project3.zip -d work
          d=$(dirname "$(find work -name gradlew | head -1)")
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"

      - name: Build APK with Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find and Copy APK
        run: |
          APK_PATH=$(find work -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" FingerFit.apk
          else
            echo "APK file not found" && exit 1
          fi

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          files: FingerFit.apk
          tag_name: v1.0.${{ github.run_number }}
          name: FingerFit App v1.0.${{ github.run_number }}
          body: |
            FingerFit অ্যাপের নতুন আপডেট। 
            নিচের FingerFit.apk ফাইলে ক্লিক করে সরাসরি ডাউনলোড করে ইনস্টল করুন।
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
