name: Kinetro APK Diagnostic Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \
            -name 'FingerFit-project*.zip' \
            -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir -p work
          unzip -q -o "./$ZIP" -d work

          GRADLEW_PATH="$(find work -type f \
            -name gradlew -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configure Gradle network timeout
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_FILE="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER_FILE" ]; then
            if grep -q '^networkTimeout=' "$WRAPPER_FILE"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER_FILE"
            else
              echo 'networkTimeout=120000' >> "$WRAPPER_FILE"
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check Java and Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/java-version.log"
          chmod +x gradlew
          ./gradlew --version 2>&1 | tee "$GITHUB_WORKSPACE/gradle-version.log"

      - name: Build APK with detailed diagnostics
        id: apk
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/apk-build.log"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kinetro-Diagnostics-${{ github.run_number }}
          path: |
            java-version.log
            gradle-version.log
            apk-build.log
            work/**/build/reports/problems/**
          if-no-files-found: warn
          retention-days: 14

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find work -type f \
            -path '*/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found."
            exit 1
          fi

          cp "$APK_PATH" Kinetro.apk
          ls -lh Kinetro.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kinetro-Debug-APK
          path: Kinetro.apk
          retention-days: 14
