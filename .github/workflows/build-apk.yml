name: Build Kinetro APK and AAB

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip the newest project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'FingerFit-project*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No FingerFit-project*.zip found in the repository root."
            exit 1
          fi

          echo "Using $ZIP"
          rm -rf work
          mkdir -p work
          unzip -q -o "./$ZIP" -d work

          GRADLEW_PATH="$(find work -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew was not found inside the project ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Increase Gradle Wrapper network timeout
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_FILE="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER_FILE" ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.properties was not found."
            exit 1
          fi

          python3 - "$WRAPPER_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          if re.search(r"(?m)^networkTimeout=.*$", content):
              content = re.sub(
                  r"(?m)^networkTimeout=.*$",
                  "networkTimeout=120000",
                  content,
                  count=1
              )
          else:
              content = content.rstrip() + "\nnetworkTimeout=120000\n"

          path.write_text(content, encoding="utf-8")
          print("Gradle Wrapper network timeout set to 120000 ms.")
          PY

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('work/**/gradle-wrapper.properties', 'work/**/*.gradle', 'work/**/*.gradle.kts', 'work/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK (for installing on phones)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "APK build attempt $attempt of 3"
            if ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon --stacktrace; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "APK build failed. Retrying after 20 seconds..."
              sleep 20
            fi
          done

          echo "::error::APK build failed after 3 attempts."
          exit 1

      - name: Build AAB (for Play Store upload)
        id: aab
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "AAB build attempt $attempt of 3"
            if ./gradlew bundleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "AAB build failed. Retrying after 20 seconds..."
              sleep 20
            fi
          done

          echo "::warning::AAB build failed after 3 attempts. APK may still be available."
          exit 1

      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find work -type f -path '*/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK file not found."
            exit 1
          fi
          cp "$APK_PATH" Kinetro.apk

          AAB_PATH="$(find work -type f -path '*/outputs/bundle/release/*.aab' -print -quit)"
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" Kinetro.aab
          else
            echo "AAB not built; continuing with APK only."
          fi

          ls -lh Kinetro.*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinetro-files
          path: |
            Kinetro.apk
            Kinetro.aab
          if-no-files-found: warn

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Kinetro.apk
            Kinetro.aab
          tag_name: v1.0.${{ github.run_number }}
          name: Kinetro App v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ## Kinetro – Fitness & Longevity

            ### ফোনে ইনস্টলের জন্য (APK)
            [Kinetro.apk ডাউনলোড করুন](https://github.com/${{ github.repository }}/releases/latest/download/Kinetro.apk)

            ডাউনলোড হলে ফাইলটি খুলে ইনস্টল করুন। (প্রয়োজনে ফোনের "Unknown sources / এই উৎস থেকে ইনস্টল" অনুমতি দিন।)

            ### Play Store-এ আপলোডের জন্য (AAB)
            [Kinetro.aab ডাউনলোড করুন](https://github.com/${{ github.repository }}/releases/latest/download/Kinetro.aab)

            AAB ফাইল ফোনে ইনস্টল হয় না। এটি শুধু Google Play Console-এ আপলোডের জন্য।
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
