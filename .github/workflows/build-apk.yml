name: Build Kinetro APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir -p work
          ZIP=$(ls FingerFit-project*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -o "./$ZIP" -d work
          d=$(dirname "$(find work -name gradlew | head -1)")
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"

      - name: Build APK with Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find and Copy APK
        run: |
          APK_PATH=$(find work -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" Kinetro.apk
          else
            echo "APK file not found" && exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinetro-apk
          path: Kinetro.apk

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          files: Kinetro.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Kinetro App v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ## Kinetro – Fitness & Longevity

            ### সরাসরি ডাউনলোড (এখানে ক্লিক করুন)
            [Kinetro.apk ডাউনলোড করুন](https://github.com/${{ github.repository }}/releases/latest/download/Kinetro.apk)

            ডাউনলোড হলে ফাইলটি খুলে ইনস্টল করুন। (প্রয়োজনে ফোনের "Unknown sources / এই উৎস থেকে ইনস্টল" অনুমতি দিন।)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
